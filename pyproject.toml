[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-1"
version = "0.1.0"
description = "Local-first foundation for the APEX-1 AI research platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "argon2-cffi>=25.1,<26",
  "PyJWT[crypto]>=2.10,<3",
  "email-validator>=2.2,<3",
  "python-multipart>=0.0.20,<1",
  "pypdf>=6,<7",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]
model = ["numpy>=2.3,<3", "torch>=2.8,<3"]

[project.scripts]
apex = "apex.cli:main"

[tool.setuptools.packages.find]
where = ["apps/api/src", "packages/apex-core/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps/api/src", "packages/apex-core/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008", "S101"]

[tool.ruff.lint.per-file-ignores]
"apps/api/src/apex_api/schemas.py" = ["S105"]
"tests/*" = ["S105"]
